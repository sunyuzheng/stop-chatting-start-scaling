  <line x1="0" y1="390.5" x2="1200" y2="390.5" stroke="#E5E7EB"/>
  <text x="42" y="482" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">Steve Yegge says people using AI coding agents are "10x to 100x as</text>
  <text x="42" y="536" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">productive as engineers using Cursor and chat today, and roughly 1000x</text>
  <text x="42" y="590" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">as productive as Googlers were back in 2005."</text>
  <text x="42" y="720" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">That's a real number. I've seen it. I've lived it. But when people hear it,</text>
  <text x="42" y="774" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">they reach for the wrong explanation. Better models. Smarter Claude.</text>
  <text x="42" y="828" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">More parameters. The 2x people and the 100x people are using the same</text>
  <text x="42" y="882" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">models. The difference isn't intelligence. It's architecture — and it fits on</text>
  <text x="42" y="936" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400">an index card.</text>
</svg>
